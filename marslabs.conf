<VirtualHost *:80>
    ServerName marslabs.my.id
    ServerAlias www.marslabs.my.id

    ProxyPreserveHost On
    ProxyPass /api/auth/ http://127.0.0.1:8001/auth/
    ProxyPassReverse /api/auth/ http://127.0.0.1:8001/auth/
    ProxyPass /api/user/ http://127.0.0.1:8001/user/
    ProxyPassReverse /api/user/ http://127.0.0.1:8001/user/
    ProxyPass /api/dosen/ http://127.0.0.1:8002/dosen/
    ProxyPassReverse /api/dosen/ http://127.0.0.1:8002/dosen/
    ProxyPass /api/mahasiswa/ http://127.0.0.1:8002/mahasiswa/
    ProxyPassReverse /api/mahasiswa/ http://127.0.0.1:8002/mahasiswa/
    ProxyPass /api/schedule/ http://127.0.0.1:8002/schedule/
    ProxyPassReverse /api/schedule/ http://127.0.0.1:8002/schedule/
    ProxyPass /api/document/ http://127.0.0.1:8003/document/
    ProxyPassReverse /api/document/ http://127.0.0.1:8003/document/
    ProxyPass /api/chatbot/ http://127.0.0.1:8003/chatbot/
    ProxyPassReverse /api/chatbot/ http://127.0.0.1:8003/chatbot/
    ProxyPass /api/admin/ http://127.0.0.1:8003/admin/
    ProxyPassReverse /api/admin/ http://127.0.0.1:8003/admin/
    ProxyPass /api/academic/ http://127.0.0.1:8003/academic/
    ProxyPassReverse /api/academic/ http://127.0.0.1:8003/academic/
    ProxyPass /docs http://127.0.0.1:8004/docs
    ProxyPassReverse /docs http://127.0.0.1:8004/docs

    ErrorLog ${APACHE_LOG_DIR}/marslabs_error.log
    CustomLog ${APACHE_LOG_DIR}/marslabs_access.log combined
</VirtualHost>
