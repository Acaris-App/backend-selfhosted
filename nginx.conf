events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        server_tokens off;

        # Gateway Health Check
        location /health {
            proxy_pass http://acaris-auth:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway Health Check
        location /api/health {
            proxy_pass http://acaris-auth:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service Health Routing
        location /api/auth/health {
            rewrite ^ /health break;
            proxy_pass http://acaris-auth:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Service Static Uploads (profile pictures)
        location /api/auth/uploads {
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://acaris-auth:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Routes
        location /api/auth {
            rewrite ^/api/auth(.*)$ /auth$1 break;
            proxy_pass http://acaris-auth:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Routes
        location /api/user {
            rewrite ^/api/user(.*)$ /user$1 break;
            proxy_pass http://acaris-auth:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================================================================
        # 2. CONSULTATION SERVICE ROUTING (acaris-consultation)
        # =========================================================================
        # Dosen Routes
        location /api/dosen {
            rewrite ^/api/dosen(.*)$ /dosen$1 break;
            proxy_pass http://acaris-consultation:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mahasiswa Routes
        location /api/mahasiswa {
            rewrite ^/api/mahasiswa(.*)$ /mahasiswa$1 break;
            proxy_pass http://acaris-consultation:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Schedule Routes
        location /api/schedule {
            rewrite ^/api/schedule(.*)$ /schedule$1 break;
            proxy_pass http://acaris-consultation:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================================================================
        # 3. DOCUMENT SERVICE ROUTING (acaris-document)
        # =========================================================================
        # Document Service Static Uploads
        location /api/document/uploads {
            rewrite ^/api/document/(.*)$ /$1 break;
            proxy_pass http://acaris-document:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Document Routes
        location /api/document {
            rewrite ^/api/document(.*)$ /document$1 break;
            proxy_pass http://acaris-document:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chatbot Routes
        location /api/chatbot {
            rewrite ^/api/chatbot(.*)$ /chatbot$1 break;
            proxy_pass http://acaris-document:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routes
        location /api/admin {
            rewrite ^/api/admin(.*)$ /admin$1 break;
            proxy_pass http://acaris-document:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docs Service Routing (Scalar API Playground)
        location /docs {
            proxy_pass http://acaris-docs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Scalar UI Static/JSON Routes
        location /scalar/ {
            proxy_pass http://acaris-docs:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
